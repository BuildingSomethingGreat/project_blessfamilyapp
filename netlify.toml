# Netlify config: the PWA (apps/web) plus the API as Netlify Functions, all on one site.
# Set these environment variables in the Netlify UI (Site configuration → Environment variables):
#   AIRTABLE_TOKEN   personal access token for base apphUgu1q4Z7ya3Tw (without it the API runs on
#                    in-memory demo data that resets whenever the function cold-starts)
#   SESSION_SECRET   long random string (admin sessions)
#   ADMIN_EMAILS     comma-separated admin emails
#   ADMIN_PASSCODE   team passcode for admin sign-in until an email provider exists
#   RESEND_API_KEY   optional, enables magic-link emails and sponsor follow-ups
#   ANTHROPIC_API_KEY optional, enables the admin assistant and message personalization
[build]
  base = "."
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @bless/api build:netlify && pnpm --filter @bless/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"

# The API function declares its own path (/api/*). This rewrite is a safety net for
# platforms that evaluate redirects first; the function normalizes the prefix.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
