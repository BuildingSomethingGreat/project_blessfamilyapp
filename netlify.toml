# Netlify config for the Bless-A-Family PWA (apps/web).
# The API lives on Fly.io; /api/* is proxied so cookies and the PWA stay same-origin.
[build]
  base = "."
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @bless/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"

# Proxy the API (change the host if you rename the Fly app).
[[redirects]]
  from = "/api/*"
  to = "https://bless-a-family-api.fly.dev/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
