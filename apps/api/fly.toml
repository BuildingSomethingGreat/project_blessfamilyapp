# Fly.io config for the Bless-A-Family API + follow-up agent.
# Deploy from the repo root:  fly deploy . --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
app = "bless-a-family-api"
primary_region = "det"   # Detroit — closest to The Konnection

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  STORE = "airtable"
  AIRTABLE_BASE_ID = "apphUgu1q4Z7ya3Tw"
  NOTIFY_DRIVER = "resend"
  WEB_URL = "https://bless-a-family.netlify.app"
  CORS_ORIGINS = "https://bless-a-family.netlify.app"
  FOLLOWUP_TICK_MINUTES = "10"
  SEED_DEMO = "false"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep exactly one machine awake: the follow-up scheduler runs in-process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
